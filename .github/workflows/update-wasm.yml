name: Update Roblox WASM Files
on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM scripts
        run: |
          # Define the current version and base URL
          VERSION="version-75f1039cb4964863-RobloxWebClient"
          BASE_URL="https://setup.rbxcdn.com/webclient/${VERSION}"
          
          # Download the files using curl
          curl -L -o WasmLoader.js "${BASE_URL}/WasmLoader.js"
          curl -L -o WasmPlayer.js "${BASE_URL}/WasmPlayer.js"
          
          # Optional: Verify the files are JavaScript (not an error page)
          head -n 1 WasmLoader.js
          head -n 1 WasmPlayer.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WasmLoader.js WasmPlayer.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Roblox WASM files to ${VERSION}"
          git push
