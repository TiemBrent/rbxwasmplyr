<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Roblox WASM Player</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-family: sans-serif;
            font-size: 20px;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading-overlay">Loading Roblox...</div>
    <div id="status"></div>

    <script>
        const statusEl = document.getElementById('status');
        const loadingOverlay = document.getElementById('loading-overlay');

        // 1. Get the joinScriptUrl from the query string.
        const params = new URLSearchParams(window.location.search);
        const joinScriptUrl = params.get('joinScriptUrl');

        if (!joinScriptUrl) {
            statusEl.textContent = 'Error: No joinScriptUrl provided.';
            loadingOverlay.textContent = 'Missing join script.';
            throw new Error('Missing joinScriptUrl');
        }
        console.log('[WASM Player] Received joinScriptUrl:', joinScriptUrl);

        const WASM_BASE = 'https://setup.rbxcdn.com/webclient/version-75f1039cb4964863-RobloxWebClient';

        // 2. Load the WasmLoader.js script FIRST.
        const loaderScript = document.createElement('script');
        loaderScript.src = `${WASM_BASE}/WasmLoader.js`;
        document.head.appendChild(loaderScript);

        loaderScript.onload = () => {
            statusEl.textContent = 'Loader script loaded. Initializing...';
            loadingOverlay.textContent = 'Initializing engine...';

            // The loader sets up window.__wasmLoaderContext. We wait for it to appear.
            const waitForContext = setInterval(() => {
                if (window.__wasmLoaderContext) {
                    clearInterval(waitForContext);
                    console.log('[WASM Player] __wasmLoaderContext is ready.');
                    
                    // 3. Now it is safe to load WasmPlayer.js.
                    const playerScript = document.createElement('script');
                    playerScript.src = `${WASM_BASE}/WasmPlayer.js`;
                    document.head.appendChild(playerScript);

                    playerScript.onload = async () => {
                        statusEl.textContent = 'Player script loaded. Starting engine...';
                        loadingOverlay.textContent = 'Starting engine...';
                        try {
                            // 4. Attempt to create the web client.
                            // The loader may have modified or wrapped this function.
                            await window.Roblox.WasmPlayer.createWebClient({
                                container: document.getElementById('canvas'),
                                baseUrl: WASM_BASE,
                                joinScriptUrl: joinScriptUrl,
                                launchData: { joinScriptUrl: joinScriptUrl }
                            });
                            statusEl.textContent = 'Game launched.';
                            loadingOverlay.style.display = 'none';
                        } catch (err) {
                            console.error('[WASM Player] Launch error:', err);
                            statusEl.textContent = 'Launch failed: ' + err.message;
                            loadingOverlay.textContent = 'Launch failed. Check console.';
                        }
                    };
                    playerScript.onerror = () => {
                        statusEl.textContent = 'Failed to load WasmPlayer.js.';
                        loadingOverlay.textContent = 'Failed to load player script.';
                    };
                }
            }, 100); // Check every 100ms for the context object.
        };

        loaderScript.onerror = () => {
            statusEl.textContent = 'Failed to load WasmLoader.js.';
            loadingOverlay.textContent = 'Failed to load loader script.';
        };
    </script>
</body>
</html>
