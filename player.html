<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox WASM Player</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100%;
    }

    /* ---- Game canvas ---- */
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* ---- Loading overlay (restored) ---- */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #eee;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 12px;
    }

    #loading-subtext {
      font-size: 13px;
      color: #777;
      max-width: 400px;
      text-align: center;
    }

    /* ---- Error state (restored) ---- */
    #error-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #error-panel.visible {
      display: flex;
    }
    #error-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ff6b6b;
    }
    #error-message {
      font-size: 14px;
      color: #bbb;
      max-width: 500px;
      margin-bottom: 20px;
      word-break: break-word;
    }

    /* ---- Controls (restored) ---- */
    #controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      padding: 8px 20px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222;
      color: #eee;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #333;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- Game canvas -->
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <!-- Loading / error overlay -->
  <div id="loading-overlay">
    <div id="loading-state">
      <div class="loading-spinner"></div>
      <div id="loading-text">Initialising…</div>
      <div id="loading-subtext"></div>
    </div>

    <div id="error-panel">
      <div id="error-title">Error</div>
      <div id="error-message"></div>
      <div id="controls">
        <button class="btn" id="btn-retry">Retry</button>
        <button class="btn" id="btn-leave">Leave</button>
      </div>
    </div>
  </div>

  <!-- 1. Install fetch wrapper + Wisp worker BEFORE engine loads -->
  <script>
  (function () {
    'use strict';

    const params = new URLSearchParams(location.search);
    const DEBUG = params.has('debug');
    const log = (...a) => console.log(...a);
    const dbg = (...a) => { if (DEBUG) console.log(...a); };

    // ---- UI helpers (restored) ----
    const overlay = document.getElementById('loading-overlay');
    const loadingState = document.getElementById('loading-state');
    const loadingText = document.getElementById('loading-text');
    const loadingSubtext = document.getElementById('loading-subtext');
    const errorPanel = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');
    const btnRetry = document.getElementById('btn-retry');
    const btnLeave = document.getElementById('btn-leave');

    window.__rbxui = {
      setLoading(text, subtext = '') {
        loadingState.style.display = 'flex';
        errorPanel.classList.remove('visible');
        loadingText.textContent = text;
        loadingSubtext.textContent = subtext;
        overlay.classList.remove('hidden');
      },
      showError(message) {
        loadingState.style.display = 'none';
        errorPanel.classList.add('visible');
        errorMessage.textContent = message;
        overlay.classList.remove('hidden');
      },
      hideOverlay() {
        overlay.classList.add('hidden');
      },
    };

    btnLeave.addEventListener('click', () => window.location.reload());
    btnRetry.addEventListener('click', () => window.location.reload());

    // ---- Endpoints safe to mock ----
    const TOLERANT_PATTERNS = [
      'economy.roblox.com/v2/assets/',
      'apis.roblox.com/universes/',
      'locale.roblox.com/',
    ];

    // ---- Domains that must go through Wisp ----
    const ROBLOX_DOMAINS = [
      'roblox.com', 'rbxcdn.com', 'robloxlabs.com', 'rbxcloud.com',
    ];
    const isRobloxUrl = (url) => {
      try {
        const h = new URL(url).hostname;
        return ROBLOX_DOMAINS.some((d) => h === d || h.endsWith('.' + d));
      } catch { return false; }
    };

    function mockResponse(url) {
      let body = { mocked: true, url };
      if (url.includes('economy.roblox.com/v2/assets/'))
        body = { AssetTypeId: 10, IsOwned: false, Name: 'Mocked Asset' };
      else if (url.includes('apis.roblox.com/universes/'))
        body = { universeId: 0, name: 'Mocked Universe', placeId: 0 };
      else if (url.includes('locale.roblox.com/'))
        body = { locale: 'en_US', language: 'en' };
      return new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'Content-Type': 'application/json' },
      });
    }

    // ---- Worker wiring ----
    const wispUrl = 'wss://epoxy-wisp-server.onrender.com';
    const worker = new Worker('./epoxy-worker.js', { type: 'module' });

    let readyResolve;
    const workerReadyPromise = new Promise((r) => { readyResolve = r; });

    const pending = new Map();
    let nextId = 1;

    worker.onmessage = (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'ready') {
        log('[WISP] Connected. Wisp fetch wrapper active.');
        readyResolve();
        return;
      }
      if (msg.type === 'error') {
        log('[WISP] Worker error:', msg.error);
        window.__rbxui.showError('Proxy worker failed: ' + msg.error);
        return;
      }
      if (msg.type === 'fetch-response') {
        const p = pending.get(msg.id);
        if (!p) return;
        pending.delete(msg.id);
        if (msg.error) { p.reject(new Error(msg.error)); return; }

        const res = new Response(msg.body, {
          status: msg.status,
          statusText: msg.statusText || '',
          headers: msg.headers,
        });
        Object.defineProperty(res, 'url', { value: p.url });
        p.resolve(res);
      }
    };

    worker.onerror = (e) => {
      log('[WISP] Worker onerror:', (e && e.message) || e);
      window.__rbxui.showError('Worker load error: ' + ((e && e.message) || 'unknown'));
    };

    function proxyFetch(url, method, headers, body) {
      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject, url });
        worker.postMessage(
          { type: 'fetch', id, url, method, headers, body },
          body ? [body] : []
        );
      });
    }

    // ---- Fetch wrapper ----
    const nativeFetch = window.fetch.bind(window);

    window.fetch = async function (input, init = {}) {
      let req;
      try {
        req = input instanceof Request ? input : new Request(input, init);
      } catch {
        return nativeFetch(input, init);
      }
      const url = req.url;

      for (const pat of TOLERANT_PATTERNS) {
        if (url.includes(pat)) {
          dbg('[FETCH] (mock) ' + req.method + ' ' + url);
          return mockResponse(url);
        }
      }

      if (isRobloxUrl(url)) {
        await workerReadyPromise;
        const body = req.body ? await req.arrayBuffer() : null;
        dbg('[FETCH] → ' + req.method + ' ' + url);
        try {
          const res = await proxyFetch(url, req.method, [...req.headers], body);
          dbg('[FETCH] ← ' + res.status + ' (wisp) ' + req.method + ' ' + url);
          return res;
        } catch (e) {
          log('[FETCH] proxy failed for ' + url + ': ' + ((e && e.message) || e));
          window.__rbxui.showError('Proxy request failed for ' + url);
          throw e;
        }
      }

      return nativeFetch(req);
    };

    // Start worker
    worker.postMessage({ type: 'init', wispUrl });

    // Set initial UI state
    window.__rbxui.setLoading('Initialising…', 'Connecting to Wisp proxy…');

    window.__rbxwasm = { worker, proxyFetch, isRobloxUrl, TOLERANT_PATTERNS };
  })();
  </script>

  <!-- 2. Load engine files -->
  <script src="./WasmLoader.js"></script>
  <script src="./WasmPlayer.js"></script>
  <script src="./WebClient.js"></script>

  <!-- 3. Start the engine -->
  <script>
  (function () {
    'use strict';

    const params = new URLSearchParams(location.search);
    const placeId = params.get('placeId');
    const debug = params.has('debug');

    if (!placeId) {
      console.warn('[LIFECYCLE] no startup place id; exiting');
      window.__rbxui.showError('Missing placeId in the URL.');
      return;
    }

    const canvas = document.getElementById('game-canvas');
    console.log('[LIFECYCLE] starting engine with placeId=' + placeId);

    window.__rbxui.setLoading('Launching game…', 'Place ID: ' + placeId);

    const startArgs = { placeId, debug, canvas };

    if (typeof window.WasmLoader !== 'undefined' && typeof window.WasmLoader.start === 'function') {
      window.WasmLoader.start(startArgs);
      return;
    }
    if (typeof window.WasmPlayer !== 'undefined' && typeof window.WasmPlayer.start === 'function') {
      window.WasmPlayer.start(startArgs);
      return;
    }
    if (typeof window.RobloxWasmStart === 'function') {
      window.RobloxWasmStart(startArgs);
      return;
    }

    console.warn(
      '[LIFECYCLE] No known engine start function found. ' +
      'Inspect WasmLoader.js / WasmPlayer.js globals and wire the start call here.'
    );
    window.__rbxui.showError('Engine start function not found. Check the console.');
  })();
  </script>
</body>
</html>
