<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Roblox WASM Player</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-family: sans-serif;
            font-size: 20px;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading-overlay">Loading Roblox...</div>
    <div id="status"></div>

    <script>
        const statusEl = document.getElementById('status');
        const loadingOverlay = document.getElementById('loading-overlay');

        // 1. Get the joinScriptUrl from the query string.
        const params = new URLSearchParams(window.location.search);
        const joinScriptUrl = params.get('joinScriptUrl');

        if (!joinScriptUrl) {
            statusEl.textContent = 'Error: No joinScriptUrl provided.';
            loadingOverlay.textContent = 'Missing join script.';
            throw new Error('Missing joinScriptUrl');
        }
        console.log('[WASM Player] Received joinScriptUrl:', joinScriptUrl);

        const WASM_BASE = 'https://setup.rbxcdn.com/webclient/version-75f1039cb4964863-RobloxWebClient';
        const REFERRER = 'https://play.roblox.com/'; // Spoof the origin

        // 2. Fetch the WasmLoader.js script with a spoofed referrer to bypass the 403.
        async function loadScriptWithReferrer(url) {
            statusEl.textContent = `Fetching ${url.split('/').pop()}...`;
            try {
                const response = await fetch(url, {
                    referrer: REFERRER,
                    referrerPolicy: 'unsafe-url',
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} for ${url}`);
                }
                const scriptText = await response.text();
                const blob = new Blob([scriptText], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);

                const script = document.createElement('script');
                script.src = blobUrl;
                document.head.appendChild(script);

                // Return a promise that resolves when the script has loaded.
                return new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = reject;
                });
            } catch (err) {
                console.error(`[WASM Player] Failed to load ${url}:`, err);
                throw err;
            }
        }

        // 3. Main initialization flow.
        (async () => {
            try {
                // Load the loader script first using our secure fetch.
                await loadScriptWithReferrer(`${WASM_BASE}/WasmLoader.js`);
                console.log('[WASM Player] WasmLoader.js loaded successfully.');

                // Wait for the loader to set up its context.
                await new Promise(resolve => {
                    const interval = setInterval(() => {
                        if (window.__wasmLoaderContext) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 100);
                });
                console.log('[WASM Player] __wasmLoaderContext is ready.');

                // Load the player script, also with the spoofed referrer.
                await loadScriptWithReferrer(`${WASM_BASE}/WasmPlayer.js`);
                console.log('[WASM Player] WasmPlayer.js loaded successfully.');

                // Now, attempt to launch the game.
                statusEl.textContent = 'Starting engine...';
                loadingOverlay.textContent = 'Starting engine...';
                await window.Roblox.WasmPlayer.createWebClient({
                    container: document.getElementById('canvas'),
                    baseUrl: WASM_BASE,
                    joinScriptUrl: joinScriptUrl,
                    launchData: { joinScriptUrl: joinScriptUrl }
                });
                statusEl.textContent = 'Game launched.';
                loadingOverlay.style.display = 'none';

            } catch (err) {
                console.error('[WASM Player] Launch error:', err);
                statusEl.textContent = 'Launch failed: ' + err.message;
                loadingOverlay.textContent = 'Launch failed. Check console.';
            }
        })();
    </script>
</body>
</html>
