<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roblox Web Client</title>
  <style>
    /* Minimal reset so the canvas fills the viewport */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { width: 100%; height: 100%; display: block; }
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #111; color: #fff; font-family: sans-serif; z-index: 100;
    }
    #loading-overlay.hidden { display: none; }
    #status { margin-bottom: 20px; font-size: 1.2rem; text-align: center; max-width: 80%; }
    #input-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; }
    #input-textarea { width: 300px; height: 40px; padding: 8px; font-size: 1rem; }
    #input-input { display: none; }
    #server, #proxyenabled { display: none; } /* placeholders required by WasmPlayer.js */
  </style>
</head>
<body>

  <!-- ========== REQUIRED DOM ELEMENTS ========== -->
  <!-- WasmPlayer.js throws if any of these are missing -->
  <canvas id="canvas"></canvas>

  <div id="loading-overlay">
    <div id="status">Initialising…</div>
  </div>

  <div id="input-container">
    <textarea id="input-textarea" placeholder="Chat…"></textarea>
    <input id="input-input" type="text" />
  </div>

  <div id="server"></div>
  <div id="proxyenabled"></div>
  <!-- ========================================== -->

  <script>
    (async function () {
      // ---------------------------------------------------------------
      // 0. Grab the joinScriptUrl from the query string
      // ---------------------------------------------------------------
      const params = new URLSearchParams(window.location.search);
      const joinScriptUrl = params.get("joinScriptUrl");

      if (!joinScriptUrl) {
        document.getElementById("status").textContent =
          "❌ Missing ?joinScriptUrl=… in the URL.";
        return;
      }

      // ---------------------------------------------------------------
      // 1. Dynamic version fetch (with localStorage cache)
      // ---------------------------------------------------------------
      const VERSION_CACHE_KEY = "rbx_webclient_version_v1";
      const VERSION_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 hours
      const FALLBACK_VERSION = "version-75f1039cb4964863-RobloxWebClient";

      /**
       * Returns the full web-client version string, e.g.:
       *   "version-75f1039cb4964863-RobloxWebClient"
       *
       * Strategy:
       *   1. Read cached version from localStorage if fresh (< 6 h old)
       *   2. Try clientsettingscdn.roblox.com (WebPlayer)
       *   3. Try clientsettingscdn.roblox.com (WindowsPlayer)
       *   4. Try setup.rbxcdn.com/version (plain text)
       *   5. Fall back to hard-coded version from the last known good build
       *
       * Caching matters because the joinScriptUrl expires quickly — we
       * don't want a cold network round-trip eating into the window.
       */
      async function fetchWebClientVersion() {
        // ---- 1. Cache lookup ----
        try {
          const cached = JSON.parse(
            localStorage.getItem(VERSION_CACHE_KEY) || "null"
          );
          if (
            cached &&
            cached.v &&
            typeof cached.t === "number" &&
            Date.now() - cached.t < VERSION_CACHE_TTL_MS
          ) {
            console.log("[player] Using cached version:", cached.v);
            return cached.v;
          }
        } catch (_) {
          /* corrupt cache — ignore and refetch */
        }

        let result = null;

        const extractFromJson = (data) => {
          if (data && data.clientVersionUpload) {
            return data.clientVersionUpload + "-RobloxWebClient";
          }
          if (typeof data === "string" && data.startsWith("version-")) {
            return data + "-RobloxWebClient";
          }
          if (data && data.version && data.version.startsWith("version-")) {
            return data.version + "-RobloxWebClient";
          }
          return null;
        };

        // ---- 2. Attempt #1 – WebPlayer ----
        try {
          const res = await fetch(
            "https://clientsettingscdn.roblox.com/v2/client-version/WebPlayer",
            { headers: { Accept: "application/json" } }
          );
          if (res.ok) {
            const v = extractFromJson(await res.json());
            if (v) result = v;
          }
        } catch (_) {
          /* network error — try next */
        }

        // ---- 3. Attempt #2 – WindowsPlayer ----
        if (!result) {
          try {
            const res = await fetch(
              "https://clientsettingscdn.roblox.com/v2/client-version/WindowsPlayer",
              { headers: { Accept: "application/json" } }
            );
            if (res.ok) {
              const v = extractFromJson(await res.json());
              if (v) result = v;
            }
          } catch (_) {
            /* ignore */
          }
        }

        // ---- 4. Attempt #3 – setup.rbxcdn.com/version ----
        if (!result) {
          try {
            const res = await fetch("https://setup.rbxcdn.com/version", {
              headers: { Accept: "text/plain" },
            });
            if (res.ok) {
              const text = (await res.text()).trim();
              if (text.startsWith("version-")) {
                result = text + "-RobloxWebClient";
              }
            }
          } catch (_) {
            /* ignore */
          }
        }

        // ---- 5. Fallback ----
        if (!result) {
          console.warn(
            "[player] Dynamic version fetch failed — using fallback:",
            FALLBACK_VERSION
          );
          result = FALLBACK_VERSION;
        }

        // ---- 6. Persist to cache ----
        try {
          localStorage.setItem(
            VERSION_CACHE_KEY,
            JSON.stringify({ v: result, t: Date.now() })
          );
        } catch (_) {
          /* quota / private mode — non-fatal */
        }

        return result;
      }

      // ---------------------------------------------------------------
      // 2. Resolve the WASM script URLs (served from YOUR origin)
      // ---------------------------------------------------------------
      // If you host the republished scripts in a sub-folder, change this
      // to e.g. "/wasm/".
      const WASM_BASE = "";

      function scriptUrl(filename) {
        return WASM_BASE + filename;
      }

      // ---------------------------------------------------------------
      // 3. Load a script and resolve when it has executed
      // ---------------------------------------------------------------
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () =>
            reject(new Error("Failed to load script: " + src));
          document.head.appendChild(s);
        });
      }

      // ---------------------------------------------------------------
      // 4. Wait for a global to appear (with timeout)
      // ---------------------------------------------------------------
      function waitForGlobal(name, timeoutMs = 10000) {
        return new Promise((resolve, reject) => {
          if (window[name]) return resolve(window[name]);

          const start = Date.now();
          const iv = setInterval(() => {
            if (window[name]) {
              clearInterval(iv);
              resolve(window[name]);
            } else if (Date.now() - start > timeoutMs) {
              clearInterval(iv);
              reject(new Error("Timed out waiting for window." + name));
            }
          }, 50);
        });
      }

      // ---------------------------------------------------------------
      // 5. Main boot sequence
      // ---------------------------------------------------------------
      try {
        const statusEl = document.getElementById("status");

        // --- 5a. Fetch the current web-client version ---
        statusEl.textContent = "Fetching web-client version…";
        const version = await fetchWebClientVersion();
        console.log("[player] Using web-client version:", version);

        // --- 5b. Build the final script URLs ---
        //   Example: /webclient/version-…-RobloxWebClient/WasmLoader.js
        const versionBase = `/webclient/${version}/`;
        const loaderUrl = scriptUrl(versionBase + "WasmLoader.js");
        const playerUrl = scriptUrl(versionBase + "WasmPlayer.js");

        // --- 5c. Load WasmLoader.js FIRST ---
        statusEl.textContent = "Loading WasmLoader.js…";
        await loadScript(loaderUrl);

        // --- 5d. Wait for __wasmLoaderContext (critical) ---
        statusEl.textContent = "Waiting for WasmLoader context…";
        await waitForGlobal("__wasmLoaderContext");

        // --- 5e. Load WasmPlayer.js SECOND ---
        statusEl.textContent = "Loading WasmPlayer.js…";
        await loadScript(playerUrl);

        // --- 5f. Wait for createWebClient to be defined ---
        statusEl.textContent = "Waiting for engine…";
        await waitForGlobal("createWebClient");

        // --- 5g. Launch ---
        statusEl.textContent = "Launching game…";

        document
          .getElementById("loading-overlay")
          .classList.add("hidden");

        window.createWebClient({
          joinScriptUrl: joinScriptUrl,
          launchData: { joinScriptUrl: joinScriptUrl },
        });

        console.log("[player] createWebClient() invoked.");
      } catch (err) {
        console.error("[player] Boot failed:", err);
        document.getElementById("status").textContent =
          "❌ " + err.message;
      }
    })();
  </script>
</body>
</html>
