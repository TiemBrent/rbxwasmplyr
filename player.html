<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox WASM Player</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #111; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; height: 100%; }
    #canvas { display: block; width: 100vw; height: 100vh; background: #000; }
    #loading-overlay { position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 1000; transition: opacity 0.3s ease; }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-background-image { position: absolute; inset: 0; object-fit: cover; opacity: 0.25; z-index: -1; }
    #loading-icon-shell { width: 96px; height: 96px; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: #222; }
    #loading-experience-icon { width: 100%; height: 100%; object-fit: cover; }
    #loading-verified-badge { display: inline-block; width: 16px; height: 16px; margin-left: 6px; vertical-align: middle; }
    #loading-experience-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    #loading-experience-creator { font-size: 14px; color: #aaa; margin-bottom: 20px; }
    #loading-text, #loading-status, #loading-message,
    #loading-progress, #loading-subtext, #status {
      font-size: 13px; color: #777; max-width: 400px;
      text-align: center; margin-top: 8px; }
    .loading-spinner { width: 32px; height: 32px;
      border: 3px solid #333; border-top-color: #eee; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-error-panel { display: none; flex-direction: column;
      align-items: center; text-align: center; padding: 24px; }
    .loading-error-panel.visible { display: flex; }
    #loading-error-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #ff6b6b; }
    #loading-error-message { font-size: 14px; color: #bbb; max-width: 500px; margin-bottom: 8px; word-break: break-word; }
    #loading-error-code { font-size: 12px; color: #666; margin-bottom: 20px; }
    .btn { padding: 8px 20px; border: 1px solid #444; border-radius: 6px;
      background: #222; color: #eee; font-size: 14px; cursor: pointer; margin: 0 4px; }
    .btn:hover { background: #333; }
    #server, #proxyenabled { position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #loading-cancel { margin-top: 16px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div id="loading-overlay">
    <img id="loading-background-image" alt="" />
    <div id="loading-icon-shell"><img id="loading-experience-icon" alt="" /></div>
    <span id="loading-verified-badge"></span>
    <div id="loading-experience-title"></div>
    <div id="loading-experience-creator"></div>
    <div class="loading-spinner"></div>
    <div id="loading-text"></div>
    <div id="loading-status"></div>
    <div id="loading-message"></div>
    <div id="loading-progress"></div>
    <div id="loading-subtext"></div>
    <div id="status"></div>
    <div id="server"></div>
    <span id="proxyenabled"></span>
    <div class="loading-error-panel">
      <div id="loading-error-title">Error</div>
      <div id="loading-error-message"></div>
      <div id="loading-error-code"></div>
      <button class="btn" id="loading-error-leave">Leave</button>
      <button class="btn" id="loading-error-cancel">Cancel</button>
    </div>
  </div>

  <!-- 1. Host config -->
  <script>
    window.robloxWasmHostConfig = { server: 'prod' };
  </script>

  <!-- 2. Fetch wrapper + Wisp worker (with cookie + CSRF) -->
  <script>
  (function () {
    'use strict';
    const params = new URLSearchParams(location.search);
    const DEBUG = params.has('debug');
    const log = (...a) => console.log(...a);
    const dbg = (...a) => { if (DEBUG) console.log(...a); };

    const TOLERANT_PATTERNS = ['locale.roblox.com/'];
    const ROBLOX_DOMAINS = ['roblox.com','rbxcdn.com','robloxlabs.com','rbxcloud.com'];
    const isRobloxUrl = (url) => {
      try { const h = new URL(url).hostname;
        return ROBLOX_DOMAINS.some(d => h === d || h.endsWith('.' + d));
      } catch { return false; }
    };

    function mockResponse(url) {
      if (url.includes('locale.roblox.com/')) {
        return new Response(JSON.stringify({ locale: 'en_US', language: 'en' }),
          { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
      return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
    }

    // --- Auth state ---
    const ROBLOX_COOKIE = (localStorage.getItem('ROBLOSECURITY') || '').trim();
    if (ROBLOX_COOKIE) {
      log('[AUTH] .ROBLOSECURITY loaded from localStorage (length=' + ROBLOX_COOKIE.length + ')');
    } else {
      log('[AUTH] No .ROBLOSECURITY in localStorage. gamejoin will fail with status 12.');
    }
    let csrfToken = null;

    const wispUrl = 'wss://epoxy-wisp-server.onrender.com';
    const worker = new Worker('./epoxy-worker.js', { type: 'module' });
    let readyResolve;
    const workerReadyPromise = new Promise((r) => { readyResolve = r; });
    const pending = new Map(); let nextId = 1;

    worker.onmessage = (event) => {
      const msg = event.data; if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'ready') { log('[WISP] Connected. Wisp fetch wrapper active.'); readyResolve(); return; }
      if (msg.type === 'error') { log('[WISP] Worker error:', msg.error); return; }
      if (msg.type === 'debug') { log(msg.msg); return; }
      if (msg.type === 'fetch-response') {
        const p = pending.get(msg.id); if (!p) return; pending.delete(msg.id);
        if (msg.error) { p.reject(new Error(msg.error)); return; }
        const res = new Response(msg.body, { status: msg.status, statusText: msg.statusText || '', headers: msg.headers });
        Object.defineProperty(res, 'url', { value: p.url });
        p.resolve(res);
      }
    };
    worker.onerror = (e) => { log('[WISP] Worker onerror:', (e && e.message) || e); };

    // --- proxyFetch: text-detection for body; used by everything below ---
    function proxyFetch(url, method, headers, body, bodyIsText) {
      if (bodyIsText === undefined && body) {
        const hdrs = headers || [];
        const ctEntry = hdrs.find(([k]) => String(k).toLowerCase() === 'content-type');
        if (ctEntry) {
          const v = String(ctEntry[1]).toLowerCase();
          bodyIsText =
            v.includes('application/json') ||
            v.includes('application/x-www-form-urlencoded') ||
            v.includes('application/javascript') ||
            v.includes('text/');
        } else {
          bodyIsText = false;
        }
      }
      bodyIsText = !!bodyIsText;

      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject, url });
        const transfer = body && !bodyIsText ? [body] : [];
        worker.postMessage(
          { type: 'fetch', id, url, method, headers, body, bodyIsText },
          transfer
        );
      });
    }

    // --- proxyFetchAuthed: cookie + CSRF injection with retry ---
    async function proxyFetchAuthed(url, method, headers, body, bodyIsText) {
      const hdrs = (headers || []).map(([k, v]) => [k, v]);

      // Inject session cookie on every Roblox request (except CDN — cookie not needed).
      if (ROBLOX_COOKIE && !/\.(rbxcdn|rbxcloud)\.com/.test(url)) {
        // Remove any caller-supplied Cookie so we don't duplicate.
        for (let i = hdrs.length - 1; i >= 0; i--) {
          if (String(hdrs[i][0]).toLowerCase() === 'cookie') hdrs.splice(i, 1);
        }
        hdrs.push(['Cookie', '.ROBLOSECURITY=' + ROBLOX_COOKIE]);
      }

      // Attach CSRF token to non-idempotent requests.
      if (csrfToken && method !== 'GET' && method !== 'HEAD') {
        hdrs.push(['X-CSRF-Token', csrfToken]);
      }

      let res = await proxyFetch(url, method, hdrs, body, bodyIsText);

      // Retry once on CSRF challenge.
      if (res.status === 403 && method !== 'GET' && method !== 'HEAD') {
        const newToken = res.headers.get('x-csrf-token');
        if (newToken) {
          log('[AUTH] CSRF challenge received; retrying with token (len=' + newToken.length + ')');
          csrfToken = newToken;
          const retry = hdrs.filter(([k]) => String(k).toLowerCase() !== 'x-csrf-token');
          retry.push(['X-CSRF-Token', csrfToken]);
          res = await proxyFetch(url, method, retry, body, bodyIsText);
        }
      }

      return res;
    }

    // --- Prefetch CSRF token on startup (uses auth.roblox.com/v2/logout as the trigger) ---
    async function prefetchCsrfToken() {
      if (!ROBLOX_COOKIE) return;
      try {
        const res = await proxyFetch(
          'https://auth.roblox.com/v2/logout',
          'POST',
          [
            ['Cookie', '.ROBLOSECURITY=' + ROBLOX_COOKIE],
            ['Content-Type', 'application/json']
          ],
          new TextEncoder().encode('{}').buffer,
          true
        );
        const t = res.headers.get('x-csrf-token');
        if (t) {
          csrfToken = t;
          log('[AUTH] Prefetched CSRF token (len=' + t.length + ')');
        } else {
          log('[AUTH] CSRF prefetch returned status ' + res.status + ' but no token');
        }
      } catch (e) {
        log('[AUTH] CSRF prefetch failed: ' + ((e && e.message) || e));
      }
    }

    // --- Global fetch wrapper ---
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async function (input, init = {}) {
      let req;
      try { req = input instanceof Request ? input : new Request(input, init); }
      catch { return nativeFetch(input, init); }
      const url = req.url;

      for (const pat of TOLERANT_PATTERNS) {
        if (url.includes(pat)) { dbg('[FETCH] (mock) ' + req.method + ' ' + url); return mockResponse(url); }
      }

      if (isRobloxUrl(url)) {
        await workerReadyPromise;
        const body = req.body ? await req.arrayBuffer() : null;
        dbg('[FETCH] → ' + req.method + ' ' + url);
        try {
          const res = await proxyFetchAuthed(url, req.method, [...req.headers], body);
          dbg('[FETCH] ← ' + res.status + ' (wisp) ' + req.method + ' ' + url);
          return res;
        } catch (e) {
          log('[FETCH] proxy failed for ' + url + ': ' + ((e && e.message) || e));
          throw e;
        }
      }

      return nativeFetch(req);
    };

    worker.postMessage({ type: 'init', wispUrl });

    // Fire the CSRF prefetch once the worker is up.
    workerReadyPromise.then(() => prefetchCsrfToken());

    window.__rbxwasm = {
      worker, proxyFetch, proxyFetchAuthed,
      isRobloxUrl, TOLERANT_PATTERNS, workerReadyPromise,
      setCookie: (v) => { localStorage.setItem('ROBLOSECURITY', v); log('[AUTH] Cookie set. Reload the page.'); },
      getCsrf: () => csrfToken
    };
  })();
  </script>

  <!-- 3. WasmPlayer.js on-the-fly patch (force set_place_id from URL) -->
  <script>
  (function () {
    'use strict';
    const log = (...a) => console.log(...a);
    const GUARD_RE = /([A-Za-z_$][\w$]*)&&([A-Za-z_$][\w$]*)\.set_place_id\(\1\)/;

    function patchWasmPlayer(src) {
      const m = src.match(GUARD_RE);
      if (!m) return src;
      const guard = m[1], mod = m[2];
      log('[PATCH] Found guard: ' + guard + '&&' + mod + '.set_place_id(' + guard + ')');
      const replacement =
        '(function(){var p=new URLSearchParams(location.search).get("placeId");' +
        'if(p){' + mod + '.set_place_id(Number(p))}' +
        'else if(' + guard + '){' + mod + '.set_place_id(' + guard + ')}})()';
      return src.replace(GUARD_RE, replacement);
    }

    const origAppend = Node.prototype.appendChild;
    Node.prototype.appendChild = function (node) {
      if (!(node instanceof HTMLScriptElement) || typeof node.src !== 'string' ||
          !/\/WasmPlayer\.js(\?|$)/.test(node.src)) {
        return origAppend.call(this, node);
      }
      const cdnUrl = node.src;
      const parent = this;
      (async () => {
        try {
          const res = await window.__rbxwasm.proxyFetch(cdnUrl, 'GET', [], null);
          const src = await res.text();
          const patched = patchWasmPlayer(src);
          const blob = URL.createObjectURL(new Blob([patched], { type: 'application/javascript' }));
          const s = document.createElement('script');
          s.src = blob;
          origAppend.call(parent, s);
          s.addEventListener('load', () => URL.revokeObjectURL(blob), { once: true });
        } catch (e) {
          console.error('[PATCH] failed:', e);
          const s = document.createElement('script');
          s.src = cdnUrl; s.crossOrigin = 'anonymous';
          origAppend.call(parent, s);
        }
      })();
      return node;
    };
  })();
  </script>

  <!-- 4. Stack-trace hook: capture WASM call stacks on launch/join decisions -->
  <script>
  (function () {
    'use strict';
    const origLog = console.log.bind(console);

    const TRIGGERS = [
      'launchUGCGame',
      'launchGame',
      'gamejoin',
      'starter place',
      'Failed to fetch starter place',
      'Not authorized to join',
      'InExperience',
      'Recursively join',
    ];

    function logStack(label, msg) {
      origLog.call(console,
        '%c[STACK-TRACE] ' + label + ' msg="' + String(msg).slice(0, 140) + '"',
        'color:#0ff;font-weight:bold');
      origLog.call(console, new Error('STACK').stack);
    }

    console.log = function (...args) {
      const msg = args.map(a => typeof a === 'string' ? a : String(a)).join(' ');
      const hit = TRIGGERS.find(t => msg.includes(t));
      if (hit) logStack('console.log', msg);
      return origLog.apply(console, args);
    };

    const poll = setInterval(() => {
      const M = window.Module;
      if (!M) return;
      if (typeof M.print === 'function' && !M.__stackHooked) {
        const origPrint = M.print;
        M.print = function (...args) {
          const msg = args.map(String).join(' ');
          const hit = TRIGGERS.find(t => msg.includes(t));
          if (hit) logStack('Module.print', msg);
          return origPrint.apply(this, args);
        };
        M.__stackHooked = true;
        origLog.call(console, '%c[HOOK] Module.print hooked',
          'color:#0f0;font-weight:bold');
      }
      if (typeof M.setStatus === 'function' && !M.__statusHooked) {
        const origStatus = M.setStatus;
        M.setStatus = function (...args) {
          const msg = args.map(String).join(' ');
          const hit = TRIGGERS.find(t => msg.includes(t));
          if (hit) logStack('Module.setStatus', msg);
          return origStatus.apply(this, args);
        };
        M.__statusHooked = true;
      }
    }, 100);

    origLog.call(console, '%c[HOOK] console.log hooked',
      'color:#0f0;font-weight:bold');
  })();
  </script>

  <!-- 5. Official loader -->
  <script src="./WasmLoader.js"></script>
</body>
</html>
