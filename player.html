<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roblox Web Client</title>
  <style>
    /* Minimal reset so the canvas fills the viewport */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { width: 100%; height: 100%; display: block; }
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #111; color: #fff; font-family: sans-serif; z-index: 100;
    }
    #loading-overlay.hidden { display: none; }
    #status { margin-bottom: 20px; font-size: 1.2rem; }
    #input-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; }
    #input-textarea { width: 300px; height: 40px; padding: 8px; font-size: 1rem; }
    #input-input { display: none; }
    #server, #proxyenabled { display: none; } /* placeholders required by WasmPlayer.js */
  </style>
</head>
<body>

  <!-- ========== REQUIRED DOM ELEMENTS ========== -->
  <!-- WasmPlayer.js throws if any of these are missing -->
  <canvas id="canvas"></canvas>

  <div id="loading-overlay">
    <div id="status">Initialising…</div>
  </div>

  <div id="input-container">
    <textarea id="input-textarea" placeholder="Chat…"></textarea>
    <input id="input-input" type="text" />
  </div>

  <div id="server"></div>
  <div id="proxyenabled"></div>
  <!-- ========================================== -->

  <script>
    (async function () {
      // ---------------------------------------------------------------
      // 0. Grab the joinScriptUrl from the query string
      // ---------------------------------------------------------------
      const params = new URLSearchParams(window.location.search);
      const joinScriptUrl = params.get("joinScriptUrl");

      if (!joinScriptUrl) {
        document.getElementById("status").textContent =
          "❌ Missing ?joinScriptUrl=… in the URL.";
        return;
      }

      // ---------------------------------------------------------------
      // 1. Dynamic version fetch – try several Roblox endpoints
      // ---------------------------------------------------------------
      /**
       * Returns the full web-client version string, e.g.:
       *   "version-75f1039cb4964863-RobloxWebClient"
       *
       * The primary source is the ClientSettings CDN
       * (clientsettingscdn.roblox.com).  We also try the generic
       * setup.rbxcdn.com/version endpoint as a fallback.
       */
      async function fetchWebClientVersion() {
        // Helper to extract the hash from a JSON response
        const extractFromJson = (data) => {
          // The ClientSettings endpoint returns a property called
          // clientVersionUpload (e.g. "version-75f1039cb4964863")
          if (data && data.clientVersionUpload) {
            return data.clientVersionUpload + "-RobloxWebClient";
          }
          // Some endpoints may return a plain string or version field
          if (typeof data === "string" && data.startsWith("version-")) {
            return data + "-RobloxWebClient";
          }
          if (data && data.version && data.version.startsWith("version-")) {
            return data.version + "-RobloxWebClient";
          }
          return null;
        };

        // Attempt #1 – ClientSettings CDN (WebPlayer)
        try {
          const res = await fetch(
            "https://clientsettingscdn.roblox.com/v2/client-version/WebPlayer",
            { headers: { Accept: "application/json" } }
          );
          if (res.ok) {
            const json = await res.json();
            const v = extractFromJson(json);
            if (v) return v;
          }
        } catch (_) { /* network error – try next */ }

        // Attempt #2 – ClientSettings CDN (WindowsPlayer – often works as a fallback)
        try {
          const res = await fetch(
            "https://clientsettingscdn.roblox.com/v2/client-version/WindowsPlayer",
            { headers: { Accept: "application/json" } }
          );
          if (res.ok) {
            const json = await res.json();
            const v = extractFromJson(json);
            if (v) return v;
          }
        } catch (_) { /* ignore */ }

        // Attempt #3 – generic setup.rbxcdn.com/version
        try {
          const res = await fetch("https://setup.rbxcdn.com/version", {
            headers: { Accept: "text/plain" },
          });
          if (res.ok) {
            const text = (await res.text()).trim();
            if (text.startsWith("version-")) {
              return text + "-RobloxWebClient";
            }
          }
        } catch (_) { /* ignore */ }

        // Hard-coded fallback – the version from your latest error log
        console.warn(
          "Dynamic version fetch failed – using hard-coded fallback."
        );
        return "version-75f1039cb4964863-RobloxWebClient";
      }

      // ---------------------------------------------------------------
      // 2. Resolve the WASM script URLs (served from YOUR origin)
      // ---------------------------------------------------------------
      // If you host the republished scripts in a sub-folder, change this.
      const WASM_BASE = ""; // e.g. "/wasm/" if you put them in a folder

      function scriptUrl(filename) {
        // Relative path → works on GitHub Pages, localhost, etc.
        return WASM_BASE + filename;
      }

      // ---------------------------------------------------------------
      // 3. Load a script and resolve when it has executed
      // ---------------------------------------------------------------
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () =>
            reject(new Error("Failed to load script: " + src));
          document.head.appendChild(s);
        });
      }

      // ---------------------------------------------------------------
      // 4. Wait for a global to appear (with timeout)
      // ---------------------------------------------------------------
      function waitForGlobal(name, timeoutMs = 10000) {
        return new Promise((resolve, reject) => {
          if (window[name]) return resolve(window[name]);

          const start = Date.now();
          const iv = setInterval(() => {
            if (window[name]) {
              clearInterval(iv);
              resolve(window[name]);
            } else if (Date.now() - start > timeoutMs) {
              clearInterval(iv);
              reject(new Error("Timed out waiting for window." + name));
            }
          }, 50);
        });
      }

      // ---------------------------------------------------------------
      // 5. Main boot sequence
      // ---------------------------------------------------------------
      try {
        // --- 5a. Show status ---
        const statusEl = document.getElementById("status");

        // --- 5b. Fetch the current web-client version ---
        statusEl.textContent = "Fetching web-client version…";
        const version = await fetchWebClientVersion();
        console.log("Using web-client version:", version);

        // --- 5c. Build the final script URLs ---
        //   Example: /webclient/version-…-RobloxWebClient/WasmLoader.js
        const versionBase = `/webclient/${version}/`; // adjust if your folder layout differs
        const loaderUrl = scriptUrl(versionBase + "WasmLoader.js");
        const playerUrl = scriptUrl(versionBase + "WasmPlayer.js");

        // --- 5d. Load WasmLoader.js FIRST ---
        statusEl.textContent = "Loading WasmLoader.js…";
        await loadScript(loaderUrl);

        // --- 5e. Wait for __wasmLoaderContext (critical) ---
        statusEl.textContent = "Waiting for WasmLoader context…";
        await waitForGlobal("__wasmLoaderContext");

        // --- 5f. Load WasmPlayer.js SECOND ---
        statusEl.textContent = "Loading WasmPlayer.js…";
        await loadScript(playerUrl);

        // --- 5g. Wait for createWebClient to be defined ---
        statusEl.textContent = "Waiting for engine…";
        await waitForGlobal("createWebClient");

        // --- 5h. Launch! ---
        statusEl.textContent = "Launching game…";

        // Hide the loading overlay once the engine is ready
        document
          .getElementById("loading-overlay")
          .classList.add("hidden");

        // The exact signature required by the WASM client
        window.createWebClient({
          joinScriptUrl: joinScriptUrl,
          launchData: { joinScriptUrl: joinScriptUrl },
        });

        console.log("✅ createWebClient() invoked.");
      } catch (err) {
        console.error("Boot failed:", err);
        document.getElementById("status").textContent =
          "❌ " + err.message;
      }
    })();
  </script>
</body>
</html>
