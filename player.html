<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox WASM Player</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #111; color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden; height: 100%;
    }

    /* Game canvas – WasmPlayer.js looks for #canvas */
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* Loading overlay – WasmPlayer.js expects #loading-overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-overlay.loading-failed .loading-spinner { display: none; }

    .loading-spinner {
      width: 48px; height: 48px;
      border: 4px solid #333;
      border-top-color: #eee;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text { font-size: 16px; color: #ccc; margin-bottom: 12px; }
    #status { font-size: 13px; color: #777; max-width: 400px; text-align: center; }

    /* Error panel – WasmPlayer.js looks for .loading-error-panel and these IDs */
    .loading-error-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .loading-error-panel.visible { display: flex; }

    #loading-error-title {
      font-size: 20px; font-weight: 600;
      margin-bottom: 8px; color: #ff6b6b;
    }
    #loading-error-message {
      font-size: 14px; color: #bbb;
      max-width: 500px; margin-bottom: 20px;
      word-break: break-word;
    }

    .btn {
      padding: 8px 20px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222; color: #eee;
      font-size: 14px; cursor: pointer;
    }
    .btn:hover { background: #333; }
  </style>
</head>
<body>
  <!-- WasmPlayer.js expects id="canvas" -->
  <canvas id="canvas" width="1280" height="720"></canvas>

  <!-- WasmPlayer.js expects id="loading-overlay" and the error panel structure -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Initialising…</div>
    <div id="status"></div>

    <div class="loading-error-panel">
      <div id="loading-error-title">Error</div>
      <div id="loading-error-message"></div>
      <button class="btn" id="loading-error-leave">Leave</button>
    </div>
  </div>

  <!-- 1. Configure the host BEFORE WasmLoader.js runs -->
  <script>
    window.robloxWasmHostConfig = {
      server: 'prod',                 // matches apiBaseUrls.prod in WasmLoader.js
      // workerStubUrl: './stub.js',  // optional – uncomment if you host a stub.js
      // engineVersion: '...'         // optional – pin a specific engine build
    };
  </script>

  <!-- 2. Install fetch wrapper + Wisp worker BEFORE engine loads -->
  <script>
  (function () {
    'use strict';

    const params = new URLSearchParams(location.search);
    const DEBUG = params.has('debug');
    const log = (...a) => console.log(...a);
    const dbg = (...a) => { if (DEBUG) console.log(...a); };

    // ---- Tolerant mocks for non-critical endpoints ----
    const TOLERANT_PATTERNS = [
      'economy.roblox.com/v2/assets/',
      'apis.roblox.com/universes/',
      'locale.roblox.com/',
    ];

    const ROBLOX_DOMAINS = [
      'roblox.com', 'rbxcdn.com', 'robloxlabs.com', 'rbxcloud.com',
    ];
    const isRobloxUrl = (url) => {
      try {
        const h = new URL(url).hostname;
        return ROBLOX_DOMAINS.some((d) => h === d || h.endsWith('.' + d));
      } catch { return false; }
    };

    function mockResponse(url) {
      let body = { mocked: true, url };
      if (url.includes('economy.roblox.com/v2/assets/'))
        body = { AssetTypeId: 10, IsOwned: false, Name: 'Mocked Asset' };
      else if (url.includes('apis.roblox.com/universes/'))
        body = { universeId: 0, name: 'Mocked Universe', placeId: 0 };
      else if (url.includes('locale.roblox.com/'))
        body = { locale: 'en_US', language: 'en' };
      return new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'Content-Type': 'application/json' },
      });
    }

    // ---- Worker wiring ----
    const wispUrl = 'wss://epoxy-wisp-server.onrender.com';
    const worker = new Worker('./epoxy-worker.js', { type: 'module' });

    let readyResolve;
    const workerReadyPromise = new Promise((r) => { readyResolve = r; });

    const pending = new Map();
    let nextId = 1;

    worker.onmessage = (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'ready') {
        log('[WISP] Connected. Wisp fetch wrapper active.');
        readyResolve();
        return;
      }
      if (msg.type === 'error') {
        log('[WISP] Worker error:', msg.error);
        return;
      }
      if (msg.type === 'fetch-response') {
        const p = pending.get(msg.id);
        if (!p) return;
        pending.delete(msg.id);
        if (msg.error) { p.reject(new Error(msg.error)); return; }
        const res = new Response(msg.body, {
          status: msg.status,
          statusText: msg.statusText || '',
          headers: msg.headers,
        });
        Object.defineProperty(res, 'url', { value: p.url });
        p.resolve(res);
      }
    };

    worker.onerror = (e) => {
      log('[WISP] Worker onerror:', (e && e.message) || e);
    };

    function proxyFetch(url, method, headers, body) {
      return new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject, url });
        worker.postMessage(
          { type: 'fetch', id, url, method, headers, body },
          body ? [body] : []
        );
      });
    }

    // ---- Fetch wrapper ----
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async function (input, init = {}) {
      let req;
      try {
        req = input instanceof Request ? input : new Request(input, init);
      } catch { return nativeFetch(input, init); }
      const url = req.url;

      for (const pat of TOLERANT_PATTERNS) {
        if (url.includes(pat)) {
          dbg('[FETCH] (mock) ' + req.method + ' ' + url);
          return mockResponse(url);
        }
      }

      if (isRobloxUrl(url)) {
        await workerReadyPromise;
        const body = req.body ? await req.arrayBuffer() : null;
        dbg('[FETCH] → ' + req.method + ' ' + url);
        try {
          const res = await proxyFetch(url, req.method, [...req.headers], body);
          dbg('[FETCH] ← ' + res.status + ' (wisp) ' + req.method + ' ' + url);
          return res;
        } catch (e) {
          log('[FETCH] proxy failed for ' + url + ': ' + ((e && e.message) || e));
          throw e;
        }
      }

      return nativeFetch(req);
    };

    worker.postMessage({ type: 'init', wispUrl });
    window.__rbxwasm = { worker, proxyFetch, isRobloxUrl, TOLERANT_PATTERNS };
  })();
  </script>

  <!-- 3. Load engine files (WasmLoader.js now finds robloxWasmHostConfig) -->
  <script src="./WasmLoader.js"></script>

  <!-- 4. WasmLoader.js dynamically injects WasmPlayer.js after resolving the engine base.
       You do NOT need to include WasmPlayer.js manually. -->
</body>
</html>
