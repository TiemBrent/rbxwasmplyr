<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox WASM Player</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            color: #eee;
        }

        /* Main rendering surface */
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000;
        }

        /* Loading overlay - required by WasmPlayer.js */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        #loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #00a2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading-overlay .message {
            font-size: 16px;
            max-width: 600px;
        }
        #loading-overlay .error {
            color: #ff5555;
            font-size: 14px;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Status bar - required by WasmPlayer.js */
        #status {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-size: 12px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 200;
            pointer-events: none;
        }

        /* Hidden elements required by WasmPlayer.js internals */
        #input-container,
        #input-textarea,
        #input-input,
        #server,
        #proxyenabled {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            pointer-events: none;
        }

        /* Fullscreen canvas helper (used by WasmPlayer.js) */
        .fullscreencanvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>
<body>
    <!-- Main rendering surface -->
    <canvas id="canvas"></canvas>

    <!-- Loading / error overlay -->
    <div id="loading-overlay">
        <div class="spinner" id="spinner"></div>
        <div class="message" id="overlay-message">Initializing...</div>
        <div class="error" id="overlay-error"></div>
    </div>

    <!-- Status bar -->
    <div id="status">Booting...</div>

    <!-- Hidden elements required by WasmPlayer.js internals -->
    <div id="input-container">
        <textarea id="input-textarea"></textarea>
        <input id="input-input" />
    </div>
    <div id="server"></div>
    <div id="proxyenabled"></div>

    <script>
        'use strict';

        // -------------------------------------------------------------------
        // Configuration
        // -------------------------------------------------------------------
        const WASM_VERSION = 'version-75f1039cb4964863-RobloxWebClient';
        const WASM_BASE = 'https://setup.rbxcdn.com/webclient/' + WASM_VERSION;
        // Your Cloudflare Worker proxy URL (with stealth-fetch)
        const PROXY_BASE = 'https://rbxwebclientfetcher.brentlankhaar2258.workers.dev';

        // -------------------------------------------------------------------
        // DOM references
        // -------------------------------------------------------------------
        const statusEl      = document.getElementById('status');
        const overlayEl     = document.getElementById('loading-overlay');
        const overlayMsg    = document.getElementById('overlay-message');
        const overlayErr    = document.getElementById('overlay-error');
        const spinnerEl     = document.getElementById('spinner');

        function setStatus(msg) {
            statusEl.textContent = msg;
            console.log('[Player] ' + msg);
        }

        function setOverlay(msg) {
            overlayMsg.textContent = msg;
        }

        function showError(msg) {
            spinnerEl.style.display = 'none';
            overlayMsg.textContent = 'Failed to launch';
            overlayErr.textContent = msg;
            statusEl.textContent = 'Error: ' + msg;
            console.error('[Player] ' + msg);
        }

        function hideOverlay() {
            overlayEl.style.display = 'none';
        }

        // -------------------------------------------------------------------
        // Read the joinScriptUrl from the query string
        // -------------------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const joinScriptUrl = params.get('joinScriptUrl');

        if (!joinScriptUrl) {
            showError('No joinScriptUrl provided in the URL. Append ?joinScriptUrl=... to the page URL.');
            throw new Error('Missing joinScriptUrl');
        }
        console.log('[Player] Received joinScriptUrl:', joinScriptUrl);

        // -------------------------------------------------------------------
        // Fetch a script through the Cloudflare Worker proxy and execute it
        // -------------------------------------------------------------------
        async function loadScriptViaProxy(scriptName) {
            const realUrl = WASM_BASE + '/' + scriptName;
            const proxyUrl = PROXY_BASE + '?url=' + encodeURIComponent(realUrl);

            setStatus('Fetching ' + scriptName + ' via proxy...');
            setOverlay('Downloading ' + scriptName + '...');

            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error('Proxy returned HTTP ' + response.status + ' for ' + scriptName);
            }

            const scriptText = await response.text();
            if (!scriptText || scriptText.length < 100) {
                throw new Error('Proxy returned empty or invalid content for ' + scriptName + ' (' + scriptText.length + ' bytes)');
            }

            console.log('[Player] Fetched ' + scriptName + ' (' + scriptText.length + ' bytes)');

            // Turn the text into a Blob URL and inject it as a <script> tag.
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            const blobUrl = URL.createObjectURL(blob);

            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = blobUrl;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Failed to execute ' + scriptName));
                document.head.appendChild(script);
            });

            console.log('[Player] ' + scriptName + ' executed successfully');
        }

        // -------------------------------------------------------------------
        // Wait for a global to appear (polling helper)
        // -------------------------------------------------------------------
        function waitForGlobal(predicate, label, timeoutMs = 20000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const interval = setInterval(() => {
                    if (predicate()) {
                        clearInterval(interval);
                        resolve();
                    } else if (Date.now() - start > timeoutMs) {
                        clearInterval(interval);
                        reject(new Error('Timed out waiting for ' + label));
                    }
                }, 100);
            });
        }

        // -------------------------------------------------------------------
        // Main boot sequence
        // -------------------------------------------------------------------
        (async function boot() {
            try {
                // Step 1: Load WasmLoader.js first.
                await loadScriptViaProxy('WasmLoader.js');

                // Step 2: Wait for the loader to set up its context.
                setStatus('Waiting for WASM context...');
                setOverlay('Preparing engine context...');
                await waitForGlobal(() => window.__wasmLoaderContext, '__wasmLoaderContext');
                console.log('[Player] __wasmLoaderContext is ready');

                // Step 3: Load WasmPlayer.js.
                await loadScriptViaProxy('WasmPlayer.js');

                // Step 4: Wait for the Roblox.WasmPlayer API.
                await waitForGlobal(
                    () => window.Roblox && window.Roblox.WasmPlayer && window.Roblox.WasmPlayer.createWebClient,
                    'Roblox.WasmPlayer.createWebClient'
                );
                console.log('[Player] Roblox.WasmPlayer is ready');

                // Step 5: Launch the game.
                setStatus('Starting engine...');
                setOverlay('Starting the Roblox engine...');

                const createWebClient = window.Roblox.WasmPlayer.createWebClient;
                const result = await createWebClient({
                    container: document.getElementById('canvas'),
                    baseUrl: WASM_BASE,
                    joinScriptUrl: joinScriptUrl,
                    launchData: { joinScriptUrl: joinScriptUrl }
                });

                console.log('[Player] createWebClient resolved:', result);

                // Hide the overlay after a short delay so the game can start rendering.
                setTimeout(() => {
                    hideOverlay();
                    setStatus('In game');
                }, 500);

            } catch (err) {
                showError(err.message || String(err));
                console.error(err);
            }
        })();

        // -------------------------------------------------------------------
        // Global error handler for debugging
        // -------------------------------------------------------------------
        window.addEventListener('error', (e) => {
            console.error('[Player] Uncaught error:', e.message);
        });
    </script>
</body>
</html>
